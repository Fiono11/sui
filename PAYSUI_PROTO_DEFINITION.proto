// This file contains the proto definition that needs to be added to support PaySui transactions.
// Add this to the appropriate proto file in the sui-rpc repository 
// (vendored/proto/sui/rpc/v2/transaction.proto or similar).

// ============================================================================
// STEP 1: Add the PaySui message definition
// ============================================================================
// Add this message definition to the proto file (alongside other transaction 
// kind messages like ChangeEpoch, Genesis, etc.):

message PaySui {
  // The coins to be used for payment
  repeated ObjectReference coins = 1;
  // The addresses that will receive payment
  repeated string recipients = 2;
  // The amounts each recipient will receive.
  // Must be the same length as recipients
  repeated uint64 amounts = 3;
}

// ============================================================================
// STEP 2: Add PaySui to the transaction_kind::Kind enum
// ============================================================================
// In the enum definition (likely named `Kind` inside `TransactionKind` message),
// add this variant. Find the enum and add:
//
//   enum Kind {
//     KIND_UNSPECIFIED = 0;
//     PROGRAMMABLE_TRANSACTION = 1;
//     CHANGE_EPOCH = 2;
//     GENESIS = 3;
//     // ... other variants ...
//     PAY_SUI = X;  // Where X is the next available enum value (likely 3 or higher)
//   }

// ============================================================================
// STEP 3: Add PaySui field to TransactionKind oneof
// ============================================================================
// In the TransactionKind message, find the oneof field (likely named `kind` or similar)
// and add:
//
//   message TransactionKind {
//     oneof kind {
//       ProgrammableTransaction programmable_transaction = 1;
//       ChangeEpoch change_epoch = 2;
//       Genesis genesis = 3;
//       // ... other fields ...
//       PaySui pay_sui = X;  // Where X is the next available field number
//     }
//   }

// ============================================================================
// NOTES:
// ============================================================================
// 1. After adding these definitions, regenerate the proto Rust code
// 2. The Rust conversion code in rpc_proto_conversions.rs is already implemented
//    and will work once the proto is updated
// 3. Make sure field numbers don't conflict with existing fields
// 4. Follow the same naming conventions as other transaction kinds in the proto
